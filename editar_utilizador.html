<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Editar dados - Grupo de Estudo ECL</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar navbar-light bg-light">

    <a class="navbar-brand"
       href="{{ url_for('index') }}">
        Grupo de Estudo ECL
    </a>

    <div class="ml-auto">

        <a class="btn btn-outline-secondary"
           href="{{ url_for('logout') }}">
            Logout
        </a>
    </div>
</nav>


<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="mb-4">
                        Editar dados
                    </h2>

                    {% with mensagens = get_flashed_messages() %}
                        {% if mensagens %}
                            {% for mensagem in mensagens %}
                                <div class="alert alert-info">{{ mensagem }}</div>

                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST"action="{{ url_for('editar_utilizador',id=utilizador.id) }}">

                        <div class="form-group">
                            <label>Nome</label>

                            <input type="text"
                                   name="nome"
                                   class="form-control"
                                   value="{{ utilizador.nome }}"
                                   required>
                        </div>


                        <div class="form-group">
                            <label>Email</label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   value="{{ utilizador.email }}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Nova palavra-passe</label>

                            <input type="password"
                                id="passe"
                                name="passe"
                                class="form-control"
                                pattern="(?=.*\d)(?=.*[\W_]).{5,}"
                                title="A palavra-passe deve ter pelo menos 5 caracteres, incluindo 1 número e 1 símbolo (ex: @, #, ., %)."
                                required>

                            <small class="form-text text-muted">
                                Mínimo de 5 caracteres, contendo pelo menos 1 número e 1 símbolo.
                            </small>
                        </div>

                        <button type="submit"class="btn btn-primary">Guardar alterações</button>

                        <a href="{{ url_for('index') }}"class="btn btn-secondary">Voltar</a>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
